repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-ast

  - repo: local
    hooks:
      - id: test-client
        name: Test client
        entry: bash -c 'PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s tests -v'
        language: system
        pass_filenames: false

      - id: verify-skill-discovery
        name: Verify skill discovery
        entry: bash
        args:
          - -e
          - -c
          - |
              output=$(npx --yes skills@1 add . --list)
              printf '%s\n' "$output"
              for skill_file in skills/*/SKILL.md; do
                [ -f "$skill_file" ] || continue
                skill_name=$(basename "$(dirname "$skill_file")")
                printf '%s\n' "$output" | grep -F -q "$skill_name"
              done
        language: system
        pass_filenames: false

      - id: validate-skill
        name: Validate skills
        entry: bash
        args:
          - -e
          - -c
          - |
              for skill in skills/*; do
                [ -f "$skill/SKILL.md" ] || continue
                skills-ref validate "$skill"
              done
        language: python
        additional_dependencies:
          - git+https://github.com/agentskills/agentskills.git@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref
        pass_filenames: false
